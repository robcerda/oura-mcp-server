[project]
name = "oura-mcp-server"
version = "0.1.0"
description = "MCP server for the Oura Ring API v2"
license = {text = "MIT"}
readme = "README.md"
authors = [
    { name = "Rob Cerda", email = "me@robcerda.com" }
]
requires-python = ">=3.12"
dependencies = [
    "mcp[cli]>=1.30,<2",
    "httpx>=0.28.0",
    "keyring>=25.0.0",
    "python-dotenv>=1.2.2",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0.3",
    "pytest-asyncio>=1.0.0",
    "ruff>=0.16.0",
]

[project.urls]
"Homepage" = "https://github.com/robcerda/oura-mcp-server"
"Bug Tracker" = "https://github.com/robcerda/oura-mcp-server/issues"

[project.scripts]
oura-mcp-server = "oura_mcp_server.server:main"
oura-mcp-login = "oura_mcp_server.login:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/oura_mcp_server"]

[tool.hatch.build]
only-packages = true

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "W"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
